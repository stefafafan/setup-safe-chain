name: Setup Safe Chain
description: Install Aikido Safe Chain in GitHub Actions with installer checksum verification.

inputs:
  version:
    description: Safe Chain release version to install, for example 1.5.1.
    required: true
  installer-sha256:
    description: SHA256 digest of install-safe-chain.sh for the selected Safe Chain release.
    required: true

runs:
  using: composite
  steps:
    - name: Install Safe Chain
      shell: bash
      env:
        SAFE_CHAIN_VERSION: ${{ inputs.version }}
        SAFE_CHAIN_INSTALLER_SHA256: ${{ inputs.installer-sha256 }}
      run: |
        set -euo pipefail

        installer="${RUNNER_TEMP}/install-safe-chain.sh"
        trap 'rm -f "$installer"' EXIT

        curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh" -o "$installer"
        echo "${SAFE_CHAIN_INSTALLER_SHA256}  $installer" | sha256sum -c -
        sh "$installer" --ci
